name: Bug report
description: Something in a component or the docs is broken.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Select
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal snippet, a CodeSandbox / StackBlitz link, or steps.
      render: tsx
  - type: input
    id: env
    attributes:
      label: Environment
      description: React, Tailwind and browser versions.
      placeholder: React 19.3, Tailwind 4.3, Chrome 141
